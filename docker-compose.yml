services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-survey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_survey_assistant
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d ai_survey_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
